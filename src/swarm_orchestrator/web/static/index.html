<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#121722">
<title>swarm</title>
<style>
/* Tokens. Night ink, not black; gold marks the finish line
   and the critical path, and nothing else. Status hues are the graph's legend. */
:root{
  --bg:#121722;--bg2:#0f141d;--sf:#182030;--sf2:#1e283a;--sf3:#253047;--ln:#263049;--ln2:#33405c;
  --tx:#e8ecf4;--tx2:#c3cad8;--mu:#8e99b0;--mu2:#667189;
  --gold:#e6c07b;--gold2:rgba(230,192,123,.16);
  --run:#5aa9ff;--ready:#3dd6b0;--blocked:#7c879e;--wait:#b592ff;--owner:#f2a541;--done:#4fae78;--failed:#f2667a;
  --up:#ff9468;--down:#3dd6b0;
  --r1:6px;--r2:10px;--r3:14px;
  --sans:system-ui,-apple-system,"Segoe UI Variable Text","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --disp:ui-rounded,"SF Pro Rounded","Segoe UI Variable Display",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --hdr:56px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 var(--sans);-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums}
body{min-height:100vh;min-height:100dvh}
button,select,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--run);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4,p{margin:0}
.id{font-family:var(--mono);font-size:.92em;font-weight:600;letter-spacing:-.01em}
.mu{color:var(--mu)}.mu2{color:var(--mu2)}
.nowrap{white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none;background:var(--mu2)}
.s-running{--c:var(--run)}.s-ready{--c:var(--ready)}.s-blocked{--c:var(--blocked)}.s-waiting{--c:var(--wait)}
.s-owner{--c:var(--owner)}.s-done{--c:var(--done)}.s-failed{--c:var(--failed)}
.dot[class*=" s-"],.dot[class^="s-"]{background:var(--c)}

/* Header ------------------------------------------------------------------ */
.top{position:sticky;top:0;z-index:30;height:calc(var(--hdr) + env(safe-area-inset-top));padding:env(safe-area-inset-top) 20px 0;display:flex;align-items:center;gap:18px;background:rgba(18,23,34,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--ln)}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand b{font:650 17px/1 var(--disp);letter-spacing:-.01em}
.brand span{color:var(--mu);font-size:13px}
.tabs{display:flex;gap:2px;height:100%;align-items:stretch;margin-left:10px}
.tab{display:flex;align-items:center;gap:8px;padding:0 14px;color:var(--mu);font-weight:550;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab svg{width:17px;height:17px;flex:none}
.tab:hover{color:var(--tx2)}
.tab[aria-selected=true]{color:var(--tx);border-bottom-color:var(--gold)}
.status{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:13px;color:var(--mu);white-space:nowrap}
.state{display:inline-flex;align-items:center;gap:7px;padding:4px 11px 4px 9px;border-radius:999px;background:var(--sf);border:1px solid var(--ln);color:var(--tx2)}
.state .dot{background:var(--c,var(--mu2))}
.state.live .dot{box-shadow:0 0 0 0 var(--c);animation:beat 2.4s ease-out infinite}
@keyframes beat{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 60%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.stale{color:var(--owner)}

/* Page frame -------------------------------------------------------------- */
main{padding:28px 28px 64px;max-width:1360px;margin:0 auto}
main.full{max-width:none;padding:0}
.sec-h{display:flex;align-items:baseline;gap:12px;margin:0 0 14px}
.sec-h h2{font:650 17px/1.3 var(--disp);letter-spacing:-.01em}
.sec-h .aside{margin-left:auto;color:var(--mu);font-size:13px}
.linkish{color:var(--run);font-weight:550;font-size:13px}
.linkish:hover{text-decoration:underline}
.panel{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r3);padding:20px 22px}
.empty{color:var(--mu);padding:14px 0}

/* Overview ----------------------------------------------------------------- */
.ov{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px}
.hero{grid-column:1/-1;position:relative;padding:26px 28px 24px;background:linear-gradient(180deg,var(--sf2),var(--sf));border:1px solid var(--ln);border-radius:var(--r3)}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:34px;align-items:end}
.hero .lead{color:var(--tx2);font-size:15px;display:flex;align-items:center;gap:8px}
.when{font:680 clamp(34px,4.4vw,54px)/1.02 var(--disp);letter-spacing:-.025em;margin:10px 0 6px;color:var(--gold)}
.when small{font-size:.5em;font-weight:600;color:var(--tx2);letter-spacing:-.01em;margin-left:4px}
.likely{color:var(--tx2);font-size:15px}
.likely b{color:var(--tx);font-weight:600}
.info-btn{width:22px;height:22px;border-radius:50%;border:1px solid var(--ln2);color:var(--mu);display:inline-grid;place-items:center;font:600 12px/1 var(--sans)}
.info-btn[aria-expanded=true]{border-color:var(--gold);color:var(--gold)}
.basis{margin-top:14px;padding:12px 14px;border-radius:var(--r2);background:var(--bg2);border:1px solid var(--ln);color:var(--tx2);font-size:13px;max-width:70ch}
.basis p+p{margin-top:6px}
.band{width:100%;height:78px;display:block;overflow:visible}
.prog{margin-top:22px}
.prog-top{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.prog-top b{font:650 20px/1 var(--disp)}
.prog-top .aside{margin-left:auto;color:var(--mu);font-size:13px}
.stack{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--sf3);gap:2px}
.stack i{display:block;height:100%;background:var(--c)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:13px;color:var(--mu)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend b{color:var(--tx2);font-weight:600}
.ask{grid-column:1/-1;border-color:color-mix(in srgb,var(--owner) 45%,var(--ln));background:color-mix(in srgb,var(--owner) 7%,var(--sf))}
.ask-item{display:block;width:100%;padding:10px 0;border-top:1px solid var(--ln)}
.ask-item:first-of-type{border-top:0}
.ask-item p{color:var(--tx2);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.runs-list{display:flex;flex-direction:column}
.run{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;padding:14px 0;border-top:1px solid var(--ln);width:100%}
.run:first-child{border-top:0;padding-top:2px}
.run:hover .id{color:var(--run)}
.run .t{color:var(--tx2);grid-column:1/-1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.run .doing{grid-column:1/-1;color:var(--mu);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.run .el{font:600 15px/1.3 var(--disp);text-align:right}
.run .el small{display:block;font:400 12px/1.3 var(--sans);color:var(--mu)}
.book-tag{color:var(--mu);font-size:13px;margin-left:8px}
.ctx{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mu)}
.ctx i{display:block;width:44px;height:4px;border-radius:2px;background:var(--sf3);position:relative;overflow:hidden}
.ctx i::after{content:"";position:absolute;inset:0;width:var(--w);background:var(--c,var(--ready))}
.cap-next{font-size:15px;color:var(--tx2);line-height:1.45}
.cap-next b{color:var(--tx);font-weight:600}
.cap-next.warn b{color:var(--owner)}.cap-next.bad b{color:var(--failed)}
.meters{display:flex;flex-direction:column;gap:16px;margin-top:18px}
.meter-h{display:flex;align-items:baseline;gap:10px;margin-bottom:7px}
.meter-h b{font:650 22px/1 var(--disp)}
.meter-h .lab{color:var(--tx2);font-weight:550}
.meter-h .aside{margin-left:auto;color:var(--mu);font-size:13px}
.gauge{position:relative;height:8px;border-radius:999px;background:var(--sf3)}
.gauge>i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--c,var(--run))}
.gauge>u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--owner);border-radius:1px}
.gauge>u.stop{background:var(--failed)}
.blist{display:flex;flex-direction:column}
.brow{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(90px,1fr) 70px minmax(120px,.9fr);gap:16px;align-items:center;padding:11px 0;border-top:1px solid var(--ln);width:100%}
.brow:first-child{border-top:0}
.brow:hover .bname{color:var(--run)}
.bname{font-weight:600;font-family:var(--mono);font-size:13.5px}
.bwhat{color:var(--mu);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{height:6px;border-radius:999px;background:var(--sf3);overflow:hidden;display:flex}
.mini i{display:block;height:100%;background:var(--c)}
.frac{text-align:right;color:var(--tx2);font-size:13px}
.eta{text-align:right;font-size:13px;color:var(--tx2)}
.eta small{display:block;color:var(--mu);font-size:12px}

/* Books tab ------------------------------------------------------------------ */
.bar-tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.seg{display:inline-flex;background:var(--bg2);border:1px solid var(--ln);border-radius:9px;padding:3px}
.seg button{padding:5px 13px;border-radius:6px;color:var(--mu);font-weight:550;font-size:13px;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--sf3);color:var(--tx)}
.search{min-width:0;flex:1 1 220px;max-width:360px;background:var(--bg2);border:1px solid var(--ln);border-radius:9px;padding:7px 12px;color:var(--tx)}
.search::placeholder{color:var(--mu2)}
select.pick{background:var(--bg2);border:1px solid var(--ln);border-radius:9px;padding:7px 10px;color:var(--tx);max-width:220px}
.btable{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r3);overflow:hidden}
.bth,.btr{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(150px,1.1fr) minmax(210px,1.2fr) minmax(150px,.9fr);gap:20px;align-items:center;padding:14px 22px}
.bth{font-size:12.5px;color:var(--mu);border-bottom:1px solid var(--ln);padding-top:11px;padding-bottom:11px;background:var(--bg2)}
.btr{border-top:1px solid var(--ln);width:100%}
.btr:first-of-type{border-top:0}
.btr:hover{background:var(--sf2)}
.btr .bname{font-size:14px}
.btr .bwhat{margin-top:2px;white-space:normal;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
.bprog .mini{height:7px}
.bprog div+div{margin-top:6px;font-size:12.5px;color:var(--mu)}
.counts{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--mu)}
.counts span{display:inline-flex;align-items:center;gap:6px}
.counts b{color:var(--tx2);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12px;border:1px solid var(--ln2);color:var(--tx2);white-space:nowrap}
.pill.on{border-color:color-mix(in srgb,var(--run) 55%,var(--ln));color:var(--run)}
.bdone{opacity:.62}

/* Kanban board ----------------------------------------------------------------- */
.kan{display:flex;gap:14px;overflow-x:auto;padding-bottom:12px;align-items:flex-start;scroll-snap-type:x proximity}
.col{flex:0 0 300px;background:var(--sf);border:1px solid var(--ln);border-radius:var(--r3);display:flex;flex-direction:column;max-height:calc(100dvh - 200px);scroll-snap-align:start}
.col.shut{flex-basis:200px}
.colh{display:flex;align-items:center;gap:9px;padding:13px 15px;width:100%}
.colh h3{font-size:14px;font-weight:600}
.colh .n{margin-left:auto;color:var(--mu);font-size:13px}
.col.shut .cards{display:none}
.cards{overflow-y:auto;padding:0 10px 10px;display:flex;flex-direction:column;gap:8px}
.card{display:block;width:100%;background:var(--bg2);border:1px solid var(--ln);border-radius:var(--r2);padding:10px 12px;border-left:3px solid var(--c,var(--ln2))}
.card:hover{border-color:var(--ln2);border-left-color:var(--c,var(--ln2))}
.card .h{display:flex;gap:8px;align-items:baseline}
.card .h .book-tag{margin-left:auto}
.card .t{margin-top:3px;color:var(--tx2);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .m{margin-top:5px;font-size:12.5px;color:var(--mu)}
.more{margin:2px 0 4px;padding:7px;border:1px dashed var(--ln2);border-radius:var(--r2);color:var(--mu);text-align:center;width:100%;font-size:13px}

/* Rows list (book sheet) ------------------------------------------------------ */
.rows{display:flex;flex-direction:column}
.rowi{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:4px 12px;align-items:baseline;padding:11px 4px;border-top:1px solid var(--ln);width:100%}
.rowi:first-child{border-top:0}
.rowi:hover{background:var(--sf2)}
.rowi .dot{transform:translateY(-1px)}
.rowi .t{grid-column:2/-1;color:var(--tx2);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rowi .why{grid-column:2/-1;color:var(--mu);font-size:12.5px}
.rowi .eta{font-size:12.5px}
.grp-h{display:flex;align-items:center;gap:8px;margin:18px 0 4px;color:var(--tx2);font-weight:600;font-size:13px}
.grp-h:first-child{margin-top:4px}
.grp-h .mu{font-weight:400}

/* Graph --------------------------------------------------------------------- */
.gwrap{position:relative;height:calc(100dvh - var(--hdr) - env(safe-area-inset-top));display:flex;flex-direction:column}
.gbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid var(--ln);background:var(--bg)}
.gbar .search{max-width:260px}
.gbar .aside{color:var(--mu2);font-size:12px;white-space:nowrap}
.gbody{position:relative;flex:1;min-height:0;display:flex}
.gcanvas{position:relative;flex:1;min-width:0;overflow:hidden;touch-action:none;background:radial-gradient(circle at 1px 1px,#1c2435 1px,transparent 1.2px) 0 0/22px 22px,var(--bg2);cursor:grab}
.gcanvas.drag{cursor:grabbing}
#gsvg{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
#gsvg .e{fill:none;stroke:#3a4661;stroke-width:1.3}
#gsvg .e.cp{stroke:var(--gold);stroke-width:2.6}
#gsvg .n rect.b{fill:var(--sf);stroke:var(--ln2);stroke-width:1}
#gsvg .n rect.k{fill:var(--c)}
#gsvg .n .i{font:600 13px var(--mono);fill:var(--tx)}
#gsvg .n .tt{font:12px var(--sans);fill:var(--mu)}
#gsvg .n{cursor:pointer}
#gsvg .n.ctxn{opacity:.5}
#gsvg .n.s-done .i{fill:var(--tx2)}
#gsvg .n.cp rect.b{stroke:var(--gold);stroke-width:2}
#gsvg .n.s-running rect.b{stroke:color-mix(in srgb,var(--run) 70%,transparent);stroke-width:1.6}
#gsvg.focus .e{opacity:.07}
#gsvg.focus .n{opacity:.16}
#gsvg.focus .e.hu,#gsvg.focus .e.hd{opacity:1;stroke-width:2.4}
#gsvg.focus .e.hu{stroke:var(--up)}#gsvg.focus .e.hd{stroke:var(--down)}
#gsvg.focus .n.hu,#gsvg.focus .n.hd,#gsvg.focus .n.sel{opacity:1}
#gsvg.focus .n.hu rect.b{stroke:var(--up);stroke-width:1.6}
#gsvg.focus .n.hd rect.b{stroke:var(--down);stroke-width:1.6}
#gsvg .n.sel rect.b{stroke:var(--tx);stroke-width:2.4}
#gsvg.find .n{opacity:.18}#gsvg.find .e{opacity:.1}
#gsvg.find .n.hit{opacity:1}
#gsvg.find .n.hit rect.b{stroke:var(--gold);stroke-width:2.4}
.zoom{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;background:var(--sf);border:1px solid var(--ln);border-radius:10px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.zoom button{width:38px;height:36px;display:grid;place-items:center;color:var(--tx2);font-size:18px;border-top:1px solid var(--ln)}
.zoom button:first-child{border-top:0}
.zoom button:hover{background:var(--sf2)}
.zoom svg{width:17px;height:17px}
.mm{position:absolute;left:16px;bottom:16px;background:rgba(15,20,29,.92);border:1px solid var(--ln);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.35);cursor:pointer}
.mm canvas{display:block;border-radius:10px}
.glegend{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:12.5px;color:var(--mu);margin-left:auto}
.glegend span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.glegend .cpk{width:16px;height:3px;border-radius:2px;background:var(--gold)}
.gside{width:360px;flex:none;border-left:1px solid var(--ln);background:var(--sf);overflow-y:auto;padding:20px 20px 28px}
.gside[hidden]{display:none}
.gside .x{float:right}
.side-h{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.side-h .id{font-size:16px}
.side-t{margin:10px 0 16px;color:var(--tx);font-size:15px;line-height:1.45}
.kv{display:grid;grid-template-columns:92px minmax(0,1fr);gap:7px 12px;font-size:13px;margin-bottom:16px}
.kv dt{color:var(--mu)}.kv dd{margin:0;color:var(--tx2);overflow-wrap:anywhere}
.side-sec{margin-top:18px}
.side-sec h4{font-size:13px;color:var(--mu);font-weight:550;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.side-sec h4 i{width:14px;height:3px;border-radius:2px;background:var(--c)}
.refs{list-style:none;margin:0;padding:0}
.refs button{display:flex;gap:9px;align-items:center;width:100%;padding:5px 6px;border-radius:6px;font-size:13px}
.refs button:hover{background:var(--sf2)}
.refs .id{flex:none;white-space:nowrap}
.refs .tt{color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:8px 14px;border-radius:9px;border:1px solid var(--ln2);background:var(--sf2);color:var(--tx);font-weight:550;font-size:13px}
.btn:hover{background:var(--sf3)}
.x{width:32px;height:32px;border-radius:8px;display:inline-grid;place-items:center;color:var(--mu);border:1px solid var(--ln)}
.x:hover{color:var(--tx);background:var(--sf2)}

/* Usage ----------------------------------------------------------------------- */
.uwin{margin-bottom:20px}
.uhead{display:flex;align-items:flex-end;gap:28px;flex-wrap:wrap;margin-bottom:14px}
.uhead .big{font:680 40px/1 var(--disp);letter-spacing:-.02em}
.uhead .big small{font-size:.45em;color:var(--mu);font-weight:600;margin-left:2px}
.uhead h2{font:650 17px/1.2 var(--disp);margin-bottom:6px;color:var(--tx2)}
.facts{display:flex;gap:26px;flex-wrap:wrap}
.fact{font-size:13px;color:var(--mu)}
.fact b{display:block;color:var(--tx);font:600 15px/1.35 var(--sans)}
.fact.hit b{color:var(--owner)}.fact.safe b{color:var(--done)}
.chart{width:100%;display:block;overflow:visible}
.chart text{font:11.5px var(--sans);fill:var(--mu)}
.chart .grid{stroke:#232c40;stroke-width:1}
.chart .ln{fill:none;stroke:var(--run);stroke-width:2;stroke-linejoin:round}
.chart .area{fill:rgba(90,169,255,.1)}
.chart .proj{fill:none;stroke:var(--gold);stroke-width:2;stroke-dasharray:6 5}
.chart .capl{stroke:var(--owner);stroke-width:1.3;stroke-dasharray:5 4}
.chart .capl.stop{stroke:var(--failed);stroke-dasharray:none}
.chart .lim{stroke:var(--ln2);stroke-width:1.3}
.chart .nowl{stroke:var(--tx2);stroke-width:1;stroke-dasharray:2 3}
.chart .rst{stroke:var(--mu2);stroke-width:1;stroke-dasharray:1 3}
.chart .old{opacity:.35;filter:grayscale(1)}
.chart .brk{stroke:var(--wait);stroke-width:1.2;stroke-dasharray:3 3}
.chart .lab-cap{fill:var(--owner)}.chart .lab-stop{fill:var(--failed)}.chart .lab-hit{fill:var(--gold);font-weight:600}
.chart .lab-brk{fill:var(--wait)}
.chart .hitdot{fill:var(--gold);stroke:var(--bg);stroke-width:2}
.chart .hover-l{stroke:var(--tx2);stroke-width:1}
.tip{position:absolute;pointer-events:none;background:var(--sf3);border:1px solid var(--ln2);border-radius:8px;padding:5px 9px;font-size:12.5px;white-space:nowrap;transform:translate(-50%,-120%);box-shadow:0 6px 18px rgba(0,0,0,.4)}

<body>
<header class="top">
  <div class="brand"><b id="proj">swarm</b><span>swarm</span></div>
  <nav class="tabs" role="tablist" aria-label="Views" id="tabs"></nav>
  <div class="status">
    <span class="slots" id="slots"></span>
    <span class="upd" id="upd"></span>
    <span class="state" id="state"><span class="dot"></span><span>connecting</span></span>
  </div>
</header>
<main id="main" tabindex="-1"></main>
<nav class="btabs" id="btabs" aria-label="Views"></nav>
<div id="sheetroot"></div>
<script>
"use strict";
// ---------------------------------------------------------------------------
// State, helpers
// ---------------------------------------------------------------------------
const TABS = [

  ["graph", "Graph", '<circle cx="5" cy="6" r="2.2"/><circle cx="5" cy="18" r="2.2"/><circle cx="19" cy="12" r="2.2"/><path d="M7.2 6.5c5 .5 5 5 9.6 5.3M7.2 17.5c5-.5 5-5 9.6-5.3"/>'],
  ["usage", "Usage", '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'],
  ["resources", "Resources", '<rect x="7" y="7" width="10" height="10" rx="1.5"/><path d="M10 3v4M14 3v4M10 17v4M14 17v4M3 10h4M3 14h4M17 10h4M17 14h4"/>'],
  ["activity", "Activity", '<path d="M4 6h16M4 12h10M4 18h13"/>'],

const S = {tab: "overview", board: null, graph: null, usage: null, et: {}, skew: 0,
  lastOk: 0, books: {mode: "open", view: "books", q: ""}, act: "finished",
  g: {mode: "open", book: "", q: "", hits: null, sel: null, vb: null, key: ""},
  res: {now: null, hist: null, table: null, tableUrl: "", cap: null, win: "24h", sort: "ended", dir: "desc", phase: "", limit: 50},
  shut: {done: true, excluded: true}, showAll: {}, infoOpen: false, sheet: null};
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const now = () => Date.now() / 1000 + S.skew;
const STATUS = {running: ["Running", "#5aa9ff"], ready: ["Ready", "#3dd6b0"], blocked: ["Blocked", "#7c879e"],
  waiting: ["Waiting for a date", "#b592ff"], owner: ["Yours", "#f2a541"], failed: ["Failed", "#f2667a"], done: ["Done", "#4fae78"]};
const COL2S = {building: "running", merging: "running", operator: "done", done: "done", needs_you: "owner", excluded: "owner", failed: "failed", ready: "ready", blocked: "blocked"};
function cstatus(c) {
  if (!c) return "blocked";
  if (c.col === "blocked" && !c.unmet && String(c.sub || "").startsWith("waits until")) return "waiting";

}
function dur(s) {
  if (s == null || !isFinite(s)) return "—";

  if (s < 60) return Math.round(s) + "s";
  if (s < 3600) return Math.round(s / 60) + "m";
  if (s < 86400) { const h = Math.floor(s / 3600), m = Math.round((s % 3600) / 60); return h + "h" + (m ? " " + m + "m" : ""); }

const rel = (t) => t == null ? "—" : t >= now() ? "in " + dur(t - now()) : dur(now() - t) + " ago";
function when(t, withDay) {

  return h;
}
const repos = (list) => list.map(r => r === "." ? "the project root" : r).join(", ");
const clipTxt = (s, n) => (s = String(s || "")).length > n ? s.slice(0, n - 1).trimEnd() + "…" : s;
const icon = (p, cls = "") => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="${cls}" aria-hidden="true">${p}</svg>`;
const dotS = (s) => `<span class="dot s-${esc(s)}" title="${esc((STATUS[s] || [s])[0])}"></span>`;
function allCards() { const out = {}; if (S.board) for (const col of S.board.columns) for (const c of col.cards) out[c.id] = c; return out; }

// ---------------------------------------------------------------------------
// Data: poll only while the page is visible; ETags make a quiet poll a 304.
// ---------------------------------------------------------------------------
async function get(url, key) {
  const r = await fetch(url, {headers: S.et[key] ? {"If-None-Match": S.et[key]} : {}, cache: "no-store"});
  if (r.status === 304) return null;
  if (!r.ok) throw new Error(r.status);
  S.et[key] = r.headers.get("ETag");
  return r.json();
}
let CARDS = {};
async function pollBoard() {
  try {
    const b = await get("/api/board", "board");
    S.lastOk = Date.now();
    if (b) {
      S.skew = (b.generated_at || Date.now() / 1000) - Date.now() / 1000;
      S.board = b; CARDS = allCards();
      render(true);
    }
    status();
  } catch (e) { status(true); }
}
async function pollGraph() {
  if (S.tab !== "graph") return;
  const g = S.g, url = `/api/graph?mode=${g.mode}${g.book ? "&book=" + encodeURIComponent(g.book) : ""}`;
  const key = "graph:" + g.mode + ":" + g.book;
  try { const d = await get(url, key); if (d) { S.graph = d; drawGraph(); } else if (!S.graph || S.graph.mode !== g.mode || S.graph.book !== g.book) { S.et[key] = null; const d2 = await get(url, key); if (d2) { S.graph = d2; drawGraph(); } } } catch (e) {}
}
async function pollUsage() {
  if (S.tab !== "usage" && S.tab !== "overview") return;
  try { const u = await get("/api/usage", "usage"); if (u) { S.usage = u; render(true); } } catch (e) {}
}
const EVERY = {board: 5000, graph: 12000, usage: 30000, res: 5000, reshist: 15000, restable: 30000, rescap: 120000};
const timers = {};
function loop(name, fn) {
  clearTimeout(timers[name]);
  const tick = async () => { if (!document.hidden) await fn(); timers[name] = setTimeout(tick, EVERY[name]); };
  tick();
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) { pollBoard(); pollGraph(); pollUsage(); pollRes(); pollResHist(); pollResTable(); pollResCap(); } });
function status(failed) {
  const b = S.board; if (!b) return;
  const h = b.header, st = $("#state");
  let c = "var(--done)", txt = "Running", live = true;
  if (!h.running) { c = "var(--mu2)"; txt = h.state ? "Stopped" : "Stopped"; live = false; }
  else if (h.finished) { txt = "Finished"; live = false; }
  else if (h.drain) { c = "var(--owner)"; txt = "Draining"; }
  else if (h.restart) { c = h.restart_stage === "failed" ? "var(--failed)" : "var(--owner)"; txt = h.restart_stage === "planned" ? "Restart planned" : h.restart_stage === "failed" ? "Restart failed" : "Restarting"; }
  else if (h.paused) { c = "var(--owner)"; txt = "Paused"; live = false; }
  else if (h.usage_hold) { c = "var(--owner)"; txt = "Held by usage cap"; live = false; }
  if (failed || Date.now() - S.lastOk > 20000) { c = "var(--failed)"; txt = "Board unreachable"; live = false; }
  st.className = "state" + (live ? " live" : ""); st.style.setProperty("--c", c);
  st.innerHTML = `<span class="dot"></span><span>${esc(txt)}</span>`;
  st.title = h.drain || h.restart || h.usage_hold || h.state || "";
  $("#slots").textContent = `${h.slots.busy} of ${h.slots.total} workers busy`;
  $("#upd").textContent = "updated " + rel(b.generated_at);
  $("#proj").textContent = b.project || "swarm";
  document.title = (h.needs_you ? `(${h.needs_you}) ` : "") + (b.project || "swarm");
}

// ---------------------------------------------------------------------------
// Navigation: #tab, with an optional &phase=<id> or &book=<name> sheet.
// ---------------------------------------------------------------------------
function navHtml(bottom) {
  return TABS.map(([k, label, p]) => `<button class="tab" role="tab" data-tab="${k}" aria-selected="${S.tab === k}">${icon(p)}<span>${bottom && k === "books" ? "Books" : label}</span></button>`).join("");
}
function paintNav() { $("#tabs").innerHTML = navHtml(false); $("#btabs").innerHTML = navHtml(true); }
function parseHash() {
  const parts = location.hash.replace(/^#/, "").split("&");
  const tab = TABS.some(t => t[0] === parts[0]) ? parts[0] : "overview";
  let sheet = null;
  for (const p of parts.slice(1)) {
    const m = /^(phase|book)=(.+)$/.exec(p);
    if (m) sheet = {kind: m[1], id: decodeURIComponent(m[2])};
  }
  return {tab, sheet};
}
function go(tab, sheet) {
  const h = "#" + tab + (sheet ? `&${sheet.kind}=${encodeURIComponent(sheet.id)}` : "");

// Charts: one figure a chart, every bucket its min-max band so a burst shows.
function niceStep(v) { const p = Math.pow(10, Math.floor(Math.log10(v || 1))), m = v / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p; }
// Runs of sampled buckets; a hole shorter than `gap` buckets is drawn through.
function runsOf(arr, gap) {

  arr.forEach((v, i) => { if (v == null) return; if (cur && i - last <= gap) cur.push(i); else out.push(cur = [i]); last = i; });
  return out;
}
let RHOVER = [];
function drawResCharts() {
  const d = S.res.hist, box = $("#res-charts"); if (!box) return;
  box.classList.toggle("wait", !d || d.window !== S.res.win);
  if (!d) return;
  RHOVER = [];
  for (const c of RCHARTS) { const svg = $(`svg[data-rc="${c.k}"]`); if (svg) rchart(svg, c, d); }
  const mins = d.step / 60;
  $("#res-res").textContent = `Each point is ${d.step < 60 ? d.step + " s" : mins < 60 ? mins + " min" : mins / 60 + " h"}: the band runs from its lowest to its highest sample, the line is its average. Shaded columns are builds.`;
}
function rchart(svg, c, d) {
  const W = svg.parentNode.clientWidth || 600, H = 168, L = 44, R = 10, T = 12, B = 30;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.style.height = H + "px";
  const n = d.n, t0 = d.t0, t1 = t0 + n * d.step, div = c.div || 1, ram = ((d.static || {}).mem_total_mb || 0) / 1024;
  const X = (t) => L + (W - L - R) * (t - t0) / (t1 - t0), xi = (i) => X(t0 + (i + .5) * d.step), bw = (W - L - R) / n;
  const ser = d.series, col = (m, how) => m === "queued" ? d.queued : ((ser[m] || {})[how] || []);
  const cols = c.band ? [col(c.band, "min"), col(c.band, "avg"), col(c.band, "max")] : c.lines.map(([m]) => col(m, "max"));
  let top = 0; for (const a of cols) for (const v of a) if (v != null && v / div > top) top = v / div;
  let ymax = c.top || (c.ram && ram ? ram : Math.max(top, c.floor || 1));
  const stepY = c.steps ? Math.max(1, Math.ceil(niceStep(ymax / 3.2))) : niceStep(ymax / 3.2);
  if (!c.top && !(c.ram && ram)) ymax = Math.ceil(ymax / stepY - 1e-9) * stepY;
  const Y = (v) => T + (H - T - B) * (1 - Math.min(v, ymax) / ymax), y0 = Y(0);
  const lab = (v) => fx(v, v % 1 ? 1 : 0) + (c.unit === "%" ? "%" : "");
  let h = "";
  // builds: a shaded column each, and a mark in the lane under the plot
  (d.spans || []).forEach((s, i) => {
    const x = X(s.a), w = Math.max(1.5, X(s.b) - x);
    h += `<rect class="sp${i % 2 ? " alt" : ""}" x="${x.toFixed(1)}" y="${T}" width="${w.toFixed(1)}" height="${H - T - B}"/><rect class="lane${s.bad === s.n ? " bad" : s.live ? " live" : ""}" x="${x.toFixed(1)}" y="${y0 + 2}" width="${Math.max(1.5, w - 1).toFixed(1)}" height="3"/>`;
  });
  for (let v = 0; v <= ymax + 1e-9; v += stepY) h += `<line class="grid" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L - 7}" y="${Y(v) + 4}" text-anchor="end">${lab(v)}</text>`;
  if (c.ram && ram) h += `<line class="lim" x1="${L}" x2="${W - R}" y1="${Y(ram)}" y2="${Y(ram)}"/><text x="${W - R}" y="${Y(ram) - 4}" text-anchor="end">${fx(ram)} G RAM</text>`;
  if (c.budget && ram && S.res.cap && S.res.cap.mem_budget) { const y = Y(ram * S.res.cap.mem_budget); h += `<line class="ref" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/><text x="${W - R}" y="${y + 13}" text-anchor="end">capacity budget, ${Math.round(100 * S.res.cap.mem_budget)}% of RAM</text>`; }
  // time ticks, on local-time boundaries
  const span = t1 - t0, fit = Math.max(2, Math.floor((W - L - R) / 76));
  const tick = [600, 1800, 3600, 3 * 3600, 6 * 3600, 12 * 3600, 86400, 2 * 86400, 5 * 86400, 7 * 86400].find(s => span / s <= fit) || 10 * 86400;
  const off = new Date(t0 * 1000).getTimezoneOffset() * 60;
  for (let t = Math.ceil((t0 - off) / tick) * tick + off; t < t1; t += tick) {
    if (X(t) < L + 14 || X(t) > W - R - 14) continue;
    const dd = new Date(t * 1000), midnight = !dd.getHours() && !dd.getMinutes();
    const txt = tick >= 86400 || (span > 86400 && midnight) ? dd.toLocaleDateString([], span > 8 * 86400 ? {month: "short", day: "numeric"} : {weekday: "short", day: "numeric"}) : hhmm(t);
    h += `<text x="${X(t).toFixed(1)}" y="${H - 6}" text-anchor="middle">${esc(txt)}</text>`;
  }
  const gap = Math.max(2, Math.ceil(45 / d.step));
  const pts = (arr, idx) => idx.map(i => `${xi(i).toFixed(1)},${Y(arr[i] / div).toFixed(1)}`).join(" ");
  if (c.band) {
    const [lo, av, hi] = cols;
    for (const run of runsOf(av, gap)) {
      if (run.length === 1) { const i = run[0]; h += `<rect class="band" x="${(xi(i) - bw / 2).toFixed(1)}" y="${Y(hi[i] / div).toFixed(1)}" width="${Math.max(1.5, bw).toFixed(1)}" height="${Math.max(1.5, Y(lo[i] / div) - Y(hi[i] / div)).toFixed(1)}"/>`; continue; }
      h += `<polygon class="band" points="${pts(hi, run)} ${pts(lo, run.slice().reverse())}"/><polyline class="mx" points="${pts(c.k === "avail" ? lo : hi, run)}"/><polyline class="ln" points="${pts(av, run)}"/>`;
    }
  } else {
    c.lines.forEach(([m, , cls], li) => {
      const arr = cols[li];
      for (const run of runsOf(arr, gap)) {
        let p = "";
        if (c.steps) for (const i of run) p += `${(xi(i) - bw / 2).toFixed(1)},${Y(arr[i]).toFixed(1)} ${(xi(i) + bw / 2).toFixed(1)},${Y(arr[i]).toFixed(1)} `;
        else if (run.length === 1) p = `${(xi(run[0]) - bw / 2).toFixed(1)},${Y(arr[run[0]]).toFixed(1)} ${(xi(run[0]) + bw / 2).toFixed(1)},${Y(arr[run[0]]).toFixed(1)}`;
        else p = pts(arr, run);

  }
  h += `<line class="hover-l" x1="0" x2="0" y1="${T}" y2="${y0}" visibility="hidden"/>`;
  svg.innerHTML = h;
  // The window's own figures, beside the title.
  const stat = $(`[data-rstat="${c.k}"]`), all = (m) => (ser[m] || {}).all, u = c.unit === "%" ? "%" : c.unit ? " " + c.unit : "", f = (v) => fx(v / div, c.unit === "G" || v / div < 100 ? 1 : 0);
  let txt = "no samples in this window";
  if (c.band && all(c.band)) { const a = all(c.band); txt = c.k === "avail" ? `lowest <b>${f(a[0])}${u}</b> · average ${f(a[1])}${u}` : `average ${f(a[1])}${u} · peak <b>${f(a[2])}${u}</b>`; }
  else if (c.k === "builds" && all("nb")) txt = `at most <b>${esc(all("nb")[2])}</b> running, <b>${Math.max(0, ...d.queued.map(v => v || 0))}</b> queued`;
  else if (c.lines && all(c.lines[1][0])) { const a = all(c.lines[1][0]); txt = `full: average ${f(a[1])}% · peak <b>${f(a[2])}%</b>`; }
  stat.innerHTML = txt;
  // Hover: one crosshair on every chart, the bucket's figures and its builds on this one.
  let tip = $(".tip", svg.parentNode);
  if (!tip) { tip = document.createElement("div"); tip.className = "tip multi"; tip.hidden = true; svg.parentNode.appendChild(tip); }
  const hl = $(".hover-l", svg);
  RHOVER.push((i) => { if (i == null) { hl.setAttribute("visibility", "hidden"); return; } hl.setAttribute("x1", xi(i)); hl.setAttribute("x2", xi(i)); hl.setAttribute("visibility", "visible"); });
  svg.onpointermove = (ev) => {
    const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * W / r.width;
    const i = Math.floor((px - L) / bw);
    if (i < 0 || i >= n) { tip.hidden = true; RHOVER.forEach(fn => fn(null)); return; }
    RHOVER.forEach(fn => fn(i));
    const a = t0 + i * d.step, b = a + d.step;
    let rows = `<b>${esc(d.step < 60 ? when(a) + ":" + String(Math.floor(a % 60)).padStart(2, "0") : d.step <= 300 ? when(a) : when(a) + " to " + (d.step >= 86400 ? when(b) : hhmm(b)))}</b>`;
    if (c.band) { const [lo, av, hi] = cols; rows += av[i] == null ? "<br>no sample" : `<br><span class="k" style="--c:var(--run)"></span>average <b>${f(av[i])}${u}</b> · low ${f(lo[i])}${u} · high ${f(hi[i])}${u}`; }
    else c.lines.forEach(([m, name, cls], li) => { const v = cols[li][i]; rows += `<br><span class="k" style="--c:var(${cls === "l2" ? "--owner" : "--run"})"></span>${name} <b>${v == null ? "—" : c.steps ? v : f(v) + u}</b>${c.steps ? "" : " at most"}`; });
    const at = (d.spans || []).filter(s => s.a < b && s.b > a);
    for (const s of at.slice(0, 3)) rows += `<span class="bl">${s.n > 1 ? `${s.n} builds${s.bad ? `, ${s.bad} failed` : ""}: ${esc(s.phases.join(", ") || "no phase")}` : `build ${esc(s.phases[0] || "(no phase)")}${s.bad ? ", failed" : s.live ? ", running" : ""} ${esc(s.cmd || "")}`}</span>`;
    if (at.length > 3) rows += `<span class="bl">and ${at.length - 3} more</span>`;

  svg.onpointerleave = () => { tip.hidden = true; RHOVER.forEach(fn => fn(null)); };
}

$("#sheetroot").addEventListener("click", (e) => { if (e.target.closest("[data-close]")) dismiss(); });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { if (S.sheet) { e.preventDefault(); dismiss(); } else if (S.tab === "graph" && G && G.sel != null) select(null); }
});
function paintBook(name, keep) {
  const c = (S.board.campaigns || []).find(x => x.name === name);
  const mine = Object.values(CARDS).filter(x => x.c === name && !x.kind);
  const order = ["running", "ready", "waiting", "blocked", "owner", "failed", "done"];
  const groups = {}; for (const x of mine) (groups[cstatus(x)] = groups[cstatus(x)] || []).push(x);
  let body = "";
  if (c) {
    const e = c.eta;
    body += `${c.about ? `<p class="mu" style="margin-top:14px;max-width:70ch">${esc(c.about)}</p>` : ""}<dl class="kv" style="margin-top:16px"><dt>Built</dt><dd>${(c.counts.done || 0) + (c.counts.operator || 0)} of ${c.total}</dd><dt>Finish</dt><dd>${e && e.p50 ? `${esc(when(e.p50, true))}, P85 ${esc(when(e.p85, true))}` : c.open ? "not timed yet" : "finished"}</dd>${c.adr ? `<dt>Decision</dt><dd>${esc(c.adr)}</dd>` : ""}</dl>
<button class="btn" data-gbook="${esc(name)}">Show it on the graph</button>`;
  }
  for (const s of order) {
    const list = groups[s]; if (!list) continue;
    body += `<div class="grp-h">${dotS(s)}${esc(STATUS[s][0])} <span class="mu">${list.length}</span></div><div class="rows">`;
    for (const x of list) {
      const why = x.col === "building" ? (x.since ? `building for ${dur(now() - x.since)}` : "building") : x.root ? `waits on ${x.root}${x.root_sub ? ", " + x.root_sub : ""}${x.needs && x.needs.length > 1 ? ` (needs ${x.needs.join(", ")})` : ""}` : x.sub || "";
      const eta = x.eta && x.eta[0] ? `~${esc(when(x.eta[0]))}` : s === "done" && x.at ? esc(when(x.at)) : "";
      body += `<button class="rowi" data-phase="${esc(x.id)}">${dotS(s)}<span class="id">${esc(x.id)}</span><span class="eta mu">${eta}</span>${x.t ? `<span class="t">${esc(x.t)}</span>` : ""}${why && s !== "done" ? `<span class="why">${esc(why)}</span>` : ""}</button>`;
    }
    body += "</div>";
  }
  frame(`<span class="id">${esc(name)}</span>`, c ? esc(c.what) : "", body || '<p class="empty">No rows.</p>', keep);
}
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-gbook]"); if (!t) return;
  S.g.book = t.dataset.gbook; S.g.mode = "open"; S.g.sel = null; $("#main").dataset.tab = ""; go("graph");
});
const NOTE = {owner_decision: "Your decisions", decision: "Decisions it made", assumption: "Assumptions", risk: "Risks"};
function refs(list) {
  if (!list || !list.length) return '<p class="mu">None.</p>';
  return `<ul class="refs">${list.map(x => { const s = x.col ? cstatus({col: x.col, sub: x.sub}) : "blocked"; return `<li><button data-phase="${esc(x.id)}">${dotS(s)}<span class="id">${esc(x.id)}</span><span class="tt">${esc(x.t || x.sub || "")}</span></button></li>`; }).join("")}</ul>`;
}
function paintSheet(id, d, keep) {
  const c = d && d.card ? d.card : CARDS[id] || {};
  let body = "";
  if (!d) body = '<p class="empty">Loading…</p>';
  else if (d.error) body = `<p class="empty" style="color:var(--failed)">${esc(d.error)}</p>`;
  else {
    const sec = (t, h) => h ? `<section><h3>${t}</h3>${h}</section>` : "";
    const s = cstatus(c);
    body += `<dl class="kv" style="margin-top:16px"><dt>Status</dt><dd>${dotS(s)} ${esc(STATUS[s][0])}${c.sub ? ", " + esc(c.sub) : ""}${c.root ? `, waits on <span class="id">${esc(c.root)}</span> (it holds up ${c.root_blocks})${c.root_sub ? ", " + esc(c.root_sub) : ""}` : ""}</dd>`;
    if (d.campaign) body += `<dt>Phase book</dt><dd><button class="linkish" data-book="${esc(d.campaign.name)}">${esc(d.campaign.name)}</button>${d.campaign.what ? ", " + esc(d.campaign.what) : ""}</dd>`;
    if (c.eta && c.eta[0]) body += `<dt>Finish</dt><dd>${esc(when(c.eta[0]))}${c.eta[1] ? `, P85 ${esc(when(c.eta[1]))}` : ""}</dd>`;
    if (d.row && d.row.dirs && d.row.dirs.length) body += `<dt>Repo</dt><dd class="id">${esc(repos(d.row.dirs))}</dd>`;
    body += `</dl>`;
    if (d.question) body += sec("Waiting on you", `<div class="md">${md(d.question)}</div>`);
    if (d.build) {
      const bl = d.build;
      body += sec("Building now", `<dl class="kv"><dt>Slot</dt><dd>${bl.slot}</dd><dt>Elapsed</dt><dd>${dur(bl.since ? now() - bl.since : bl.elapsed)}</dd>${bl.branch ? `<dt>Branch</dt><dd class="id">${esc(bl.branch)}</dd>` : ""}${c.ctx != null ? `<dt>Context</dt><dd>${Math.round(c.ctx)}%</dd>` : ""}</dl>${bl.last_turn ? `<p class="mu" style="margin-bottom:6px">Its last words, ${esc(rel(bl.last_turn.ts))}</p><div class="md">${md(bl.last_turn.text)}</div>` : ""}`);
    }
    if (d.needs) body += sec(`Needs (${d.needs.length})`, refs(d.needs));
    if (d.blocks) body += sec(`Unblocks (${d.blocks.length} directly, ${d.blocks_total} in all)`, refs(d.blocks));
    if (d.row && d.row.text) body += sec("The ledger row", `${d.row.section && d.row.section.length ? `<p class="mu" style="margin-bottom:6px">${md(d.row.section.join(" › "))}${d.row.line ? ", line " + d.row.line : ""}</p>` : ""}<div class="md">${md(d.row.text)}</div>`);
    if (d.recap) body += sec("Recap", `<p class="pre">${md(d.recap.summary)}</p>`);
    if (d.completion && d.completion.note) body += sec(`Completion note (${esc(d.completion.status)}, ${esc(when(d.completion.ts))})`, `<div class="md">${md(d.completion.note)}</div>`);
    if (d.notes) for (const [k, list] of Object.entries(d.notes)) body += sec(NOTE[k] || k, list.map(n => `<div class="note ${esc(k)}">${md(n.text)}</div>`).join(""));
    if (d.jobs && d.jobs.length) body += sec("Operator jobs", d.jobs.map(j => `<div class="note"><span class="id">${esc(j.id)}</span> <span class="mu">${esc(j.state)}${j.when ? ", " + esc(j.when) : ""}</span><div class="pre">${md(j.note)}</div>${j.question ? `<p style="color:var(--owner)">Asks: ${esc(j.question)}${j.answer ? " Answered: " + esc(j.answer) : ""}</p>` : ""}${j.outcome ? `<p style="color:var(--done)">Did: ${md(j.outcome)}</p>` : ""}${j.error ? `<p style="color:var(--failed)">${esc(j.error)}</p>` : ""}</div>`).join(""));
    if (d.runs && d.runs.length) body += sec("Runs", `<table class="tbl"><tbody>${d.runs.map(r => `<tr><td>${esc(when(r.started || r.ended, true))}</td><td>${esc(r.status || "running")}</td><td class="r">${r.took ? dur(r.took) : ""}</td></tr>`).join("")}</tbody></table>`);
    if (d.attempts && d.attempts.length) body += sec("Attempts", d.attempts.map(a => `<div class="note"><span class="tag ${a.status === "fail" ? "bad" : "ok"}">${esc(a.status)}</span> <span class="mu">${esc(when(a.ts, true))}</span><div class="pre">${md(a.note)}</div></div>`).join(""));
    if (d.excluded_why) body += sec("Why it is yours to do", `<p>${md(d.excluded_why)}</p>`);
  }
  frame(`<span class="id">${esc(id)}</span>`, c.t ? esc(c.t) : "", body, keep);
}

// Live clocks without a re-render.
setInterval(() => {
  $$("[data-since]").forEach(el => { if (+el.dataset.since) el.textContent = dur(now() - +el.dataset.since); });
  if (S.board) $("#upd").textContent = "updated " + rel(S.board.generated_at);
}, 10000);

// Old deep links (#phase=<id>) still open the row.
if (/^#phase=/.test(location.hash)) location.replace("#overview&" + location.hash.slice(1));
paintNav();
pollBoard().then(() => { route(); loop("board", pollBoard); loop("usage", pollUsage); loop("graph", pollGraph); loop("res", pollRes); loop("reshist", pollResHist); loop("restable", pollResTable); loop("rescap", pollResCap); });
</script>
