<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560"
     font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
     role="img" aria-label="swarm-orchestrator at runtime: a detached supervisor reads control.fifo and owns state.json; it opens Claude Code sessions in a tmux session (dashboard, overseer, operator, worker slots, web board), merges each finished phase's branch through a serialized queue into the project's repos, and pings the owner on Telegram">
  <defs>
    <marker id="amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F2A541"/></marker>
    <marker id="ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8E8B85"/></marker>
  </defs>
  <style>
    .m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace}
    .ink{fill:#EDEAE3}.mut{fill:#8E8B85}.amb{fill:#F2A541}
    .t10{font-size:10.5px}.t11{font-size:11.5px}.t12{font-size:12.5px}.t14{font-size:14.5px;font-weight:600}
    .eye{font-size:11px;letter-spacing:2.4px}
    .box{fill:#191C22;stroke:#2E323A;stroke-width:1}
    .card{fill:#20242B;stroke:#343943;stroke-width:1}
    .hot{fill:#191C22;stroke:#F2A541;stroke-width:1.5}
    .free{fill:none;stroke:#3A3F48;stroke-width:1;stroke-dasharray:4 4}
    .flow{fill:none;stroke-width:1.6}
  </style>

  <rect width="1000" height="560" rx="18" fill="#111318"/>
  <text x="32" y="40" class="m eye mut">SWARM-ORCHESTRATOR · RUNTIME</text>

  <!-- owner -->
  <rect x="32" y="66" width="220" height="34" rx="17" class="box"/>
  <text x="142" y="87" text-anchor="middle" class="ink t12">owner · terminal or phone</text>
  <path class="flow" d="M142,100 L142,128" stroke="#8E8B85" marker-end="url(#ink)"/>
  <text x="152" y="118" class="m t10 mut">swarm CLI</text>

  <!-- supervisor -->
  <rect x="32" y="132" width="220" height="252" rx="12" class="hot"/>
  <text x="50" y="160" class="ink t14">supervisor</text>
  <text x="50" y="177" class="t10 mut">detached · one event loop</text>
  <rect x="50" y="190" width="184" height="26" rx="6" class="card"/>
  <text x="62" y="207" class="m t11 ink">control.fifo</text>
  <rect x="50" y="222" width="184" height="26" rx="6" class="card"/>
  <text x="62" y="239" class="m t11 ink">state.json · flock</text>
  <text x="50" y="272" class="t11 ink">launcher</text>
  <text x="156" y="272" class="t10 mut">ledger order</text>
  <text x="50" y="292" class="t11 ink">merge queue</text>
  <text x="156" y="292" class="t10 mut">one at a time</text>
  <text x="50" y="312" class="t11 ink">park timer</text>
  <text x="156" y="312" class="t10 mut">own window</text>
  <text x="50" y="332" class="t11 ink">Overseer policy</text>
  <text x="156" y="332" class="t10 mut">when to review</text>
  <text x="50" y="352" class="t11 ink">watchdog · gc</text>
  <text x="156" y="352" class="t10 mut">panes, disk</text>
  <text x="50" y="372" class="t11 ink">operator sweep</text>
  <text x="156" y="372" class="t10 mut">hand-offs</text>

  <!-- state dir -->
  <path class="flow" d="M142,384 L142,400" stroke="#8E8B85"/>
  <rect x="32" y="400" width="220" height="126" rx="12" class="box"/>
  <text x="50" y="424" class="t12 ink">state dir</text>
  <text x="50" y="441" class="m t10 mut">~/.local/state/swarm-orchestrator/</text>
  <text x="50" y="457" class="m t10 mut">  &lt;project&gt;-&lt;hash&gt;/</text>
  <text x="50" y="477" class="m t10 ink">done/  operator/  overseer/</text>
  <text x="50" y="493" class="m t10 ink">notes/ meters/  history/</text>
  <text x="50" y="509" class="m t10 ink">logs/  wt/  tmp/  cache/</text>

  <!-- tmux session -->
  <rect x="310" y="66" width="658" height="316" rx="14" fill="#15181D" stroke="#2E323A"/>
  <text x="330" y="90" class="t12 mut">tmux session · one per project</text>

  <rect x="330" y="102" width="120" height="54" rx="8" class="card"/>
  <text x="342" y="122" class="m t11 amb">0 dash</text>
  <text x="342" y="141" class="t10 mut">swarm tui</text>
  <rect x="460" y="102" width="150" height="54" rx="8" class="card"/>
  <text x="472" y="122" class="m t11 amb">1 overseer</text>
  <text x="472" y="141" class="t10 mut">init pass, then reviews</text>
  <rect x="620" y="102" width="150" height="54" rx="8" class="card"/>
  <text x="632" y="122" class="m t11 amb">2 operator</text>
  <text x="632" y="141" class="t10 mut">one hand-off at a time</text>
  <rect x="780" y="102" width="168" height="54" rx="8" class="card"/>
  <text x="792" y="122" class="m t11 amb">web · last window</text>
  <text x="792" y="141" class="t10 mut">read-only LAN board</text>

  <text x="330" y="182" class="m t11 amb">3 workers</text>
  <text x="402" y="182" class="t10 mut">slots 0-3 · more slots open workers-2, workers-3 …, 4 panes each</text>
  <rect x="330" y="192" width="304" height="72" rx="8" class="card"/>
  <text x="344" y="212" class="t11 ink">slot 0 · claude</text>
  <text x="344" y="230" class="m t10 amb">/prime api-P3</text>
  <text x="344" y="248" class="m t10 mut">cwd wt/api-P3 · branch swarm/api-P3</text>
  <rect x="648" y="192" width="300" height="72" rx="8" class="card"/>
  <text x="662" y="212" class="t11 ink">slot 1 · claude</text>
  <text x="662" y="230" class="m t10 amb">/prime web-P2</text>
  <text x="662" y="248" class="m t10 mut">cwd wt/web-P2 · branch swarm/web-P2</text>
  <rect x="330" y="274" width="304" height="72" rx="8" class="card"/>
  <text x="344" y="294" class="t11 ink">slot 2 · claude</text>
  <text x="344" y="312" class="m t10 amb">/prime db-P1</text>
  <text x="344" y="330" class="m t10 mut">cwd wt/db-P1 · branch swarm/db-P1</text>
  <rect x="648" y="274" width="300" height="72" rx="8" class="free"/>
  <text x="662" y="294" class="t11 mut">slot 3 · free</text>
  <text x="662" y="312" class="t10 mut">the next ready phase lands here</text>

  <text x="330" y="368" class="t10 mut">opened on demand:</text>
  <text x="446" y="368" class="m t10 ink">wait:&lt;phase&gt;</text>
  <text x="532" y="368" class="t10 mut">parked worker</text>
  <text x="618" y="368" class="m t10 ink">resolve-&lt;phase&gt;</text>
  <text x="718" y="368" class="t10 mut">merge-conflict resolver</text>

  <!-- workers -> fifo -->
  <path class="flow" d="M326,206 C300,206 270,203 238,203" stroke="#8E8B85" marker-end="url(#ink)"/>
  <text x="256" y="196" class="m t10 mut">done …</text>
  <!-- launcher -> slot -->
  <path class="flow" d="M252,268 C290,268 292,300 326,300" stroke="#F2A541" marker-end="url(#amber)"/>
  <text x="262" y="262" class="m t10 amb">launch</text>

  <!-- merge queue -> repos -->
  <path class="flow" d="M252,292 C272,292 282,300 282,316 L282,440 C282,452 290,456 302,456 L466,456" stroke="#F2A541" marker-end="url(#amber)"/>
  <text x="300" y="448" class="m t10 amb">merge + push</text>

  <!-- pings -->
  <path class="flow" d="M252,362 C262,362 266,368 266,380 L266,495 C266,503 272,503 306,503" stroke="#8E8B85" stroke-dasharray="4 4" marker-end="url(#ink)"/>
  <rect x="310" y="486" width="130" height="34" rx="17" class="box"/>
  <text x="375" y="507" text-anchor="middle" class="ink t12">Telegram</text>
  <text x="330" y="540" class="m t10 mut">pings: fail, questions, holds, finish</text>

  <!-- repos -->
  <rect x="470" y="410" width="498" height="120" rx="12" class="box"/>
  <text x="488" y="434" class="t12 ink">project repos</text>
  <text x="580" y="434" class="t10 mut">umbrella + component repos, each on its main</text>
  <rect x="488" y="446" width="140" height="68" rx="8" class="card"/>
  <text x="500" y="466" class="m t11 ink">umbrella</text>
  <text x="500" y="484" class="m t10 mut">ledger, docs</text>
  <text x="500" y="500" class="m t10 mut">main</text>
  <rect x="638" y="446" width="140" height="68" rx="8" class="card"/>
  <text x="650" y="466" class="m t11 ink">api/</text>
  <text x="650" y="484" class="m t10 mut">component repo</text>
  <text x="650" y="500" class="m t10 mut">main</text>
  <rect x="788" y="446" width="162" height="68" rx="8" class="card"/>
  <text x="800" y="466" class="m t11 ink">web/</text>
  <text x="800" y="484" class="m t10 mut">component repo</text>
  <text x="800" y="500" class="m t10 mut">main</text>
</svg>
